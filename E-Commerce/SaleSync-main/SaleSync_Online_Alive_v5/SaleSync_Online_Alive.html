function card(p){let off=p.was>p.price?Math.round((p.was-p.price)/p.was*100):0;let b=storeMeta(p.seller);return `<article class="surface product" style="--store-accent:${e(b.accent)}"><div class="product-media"><button data-detail="${p.id}" aria-label="View details: ${e(p.name)}" class="media-hit">${image(p)}</button>${off?`<span class="sale-tag">Save ${off}%</span>`:''}<div class="media-buttons"><button data-wish="${p.id}" title="Save to wishlist" aria-label="Save ${e(p.name)}">${db.wish.includes(p.id)?'♥':'♡'}</button><button data-compare="${p.id}" aria-label="Compare ${e(p.name)}" title="Compare">${db.compare.includes(p.id)?'☑':'⊞'}</button></div><span class="media-caption">${e(p.category)}</span></div><div class="prod-body"><button class="card-store-link" data-store="${e(p.seller)}"><img src="${e(b.mark)}" alt="" width="23" height="23"><span>${e(p.seller)}</span><span class="store-arrow" aria-hidden="true">↗</span></button><div class="prod-name" data-detail="${p.id}" role="button" tabindex="0">${e(p.name)}</div><div class="price">${fmt(p.price)} ${off?`<span class="was">${fmt(p.was)}</span>`:''}</div><div class="prod-bottom"><div>${stockPill(p)}</div><button class="btn alt" data-add="${p.id}" ${ownAvailable(p)<=0?'disabled':''}>${ownAvailable(p)>0?'Add to cart +':'Unavailable'}</button></div></div></article>`}
function section(t,sub,button,page){return `<div class="section-head"><div><h2>${e(t)}</h2><p>${e(sub)}</p></div>${button?`<button class="btn ghost mini" data-page="${page||'shop'}">${e(button)} →</button>`:''}</div>`}
function home(){let picks=['p1','p5','p7','p8'].map(product).filter(p=>p&&p.published);let slides=[{label:'YOUR EVERYDAY, UPGRADED',headline:'Discover your next <em>favorite find.</em>',copy:'The tech you want, the style you love, and useful finds for every corner of your day.',cta:'Explore the collection',category:'All',product:'p1'},{label:'TECHHUB PH · THE DESK EDIT',headline:'Small upgrades. <em>Big everyday energy.</em>',copy:'Explore the tech collection from TechHub PH, built around your everyday routines.',cta:'Visit TechHub PH',store:'TechHub PH',product:'p2'},{label:'STYLEHUB · THE DAILY EDIT',headline:'Wear what feels <em>like you.</em>',copy:'Everyday pieces and home finds from StyleHub, collected in one easy storefront.',cta:'Visit StyleHub',store:'StyleHub',product:'p5'}];let h=slides[ui.heroSlide%slides.length],heroProduct=product(h.product)||visibleProducts()[0]||{name:"SaleSync Online",photo:"assets/logo-email.png",fallback:"assets/logo-email.png"};return `<div class="wrap page homepage"><div class="hero-grid"><section class="hero hero-v5 hero-slide-${ui.heroSlide%slides.length}"><div class="hero-copy"><span class="hero-eyebrow">${e(h.label)}</span><h1>${h.headline}</h1><p>${e(h.copy)}</p><div class="hero-buttons"><button class="btn hero-btn" ${h.store?`data-store="${e(h.store)}"`:'data-page="shop"'}>${e(h.cta)} <span aria-hidden="true">↗</span></button><button class="btn hero-quiet" data-page="sellers">Meet our stores</button></div><div class="hero-dots" aria-label="Promotions">${slides.map((_,i)=>`<button class="${ui.heroSlide===i?'active':''}" data-hero-slide="${i}" aria-label="Show banner ${i+1}" aria-pressed="${ui.heroSlide===i}"></button>`).join('')}</div></div><div class="hero-art" aria-hidden="true"><div class="hero-orbit orbit-one"></div><div class="hero-orbit orbit-two"></div><div class="hero-product-blob"><img src="${e(heroProduct.photo||heroProduct.fallback)}" onerror="this.onerror=null;this.src='${e(heroProduct.fallback)}'" width="480" height="480" alt=""></div><div class="hero-float-note">${e(heroProduct.name)}</div></div></section><div class="sidepromo"><div class="promo promo-tech"><span class="tiny">TECHHUB PH</span><h3>The setup edit.</h3><p>Tech worth exploring.</p><img src="assets/products/p2.svg" alt="" width="155" height="140"><button data-store="TechHub PH">Explore tech ↗</button></div><div class="promo promo-style"><span class="tiny">STYLEHUB</span><h3>Everyday, styled.</h3><p>Meet your new favorites.</p><img src="assets/products/p5.svg" alt="" width="155" height="140"><button data-store="StyleHub">Explore style ↗</button></div></div></div><div class="trustline"><div><span class="trusticon">◇</span><div><strong>One secure checkout flow</strong><small>Payment through PayMongo at checkout</small></div></div><div><span class="trusticon">▣</span><div><strong>Discover independent stores</strong><small>Explore each seller's collection</small></div></div><div><span class="trusticon">↗</span><div><strong>Track your orders</strong><small>See every step in your account</small></div></div><div><span class="trusticon">♡</span><div><strong>Save your favorites</strong><small>Build a wishlist and compare up to four</small></div></div></div>${section('Shop what you love','Start with a category, find something worth keeping.','Shop everything')}<div class="categorygrid categorygrid--visual">${CATS.map((c,i)=>{let featured={Electronics:'p1',Fashion:'p5','Home & Living':'p4',Beauty:'p8',Sports:'p9',Accessories:'p10'}[c],p=product(featured);return `<button class="category visual-category" data-category="${e(c)}"><span class="category-art category-art-${i}"><img src="${e(p?.photo||p?.fallback||'')}" onerror="this.onerror=null;this.src='${e(p?.fallback||'')}'" alt="" loading="lazy" width="100" height="100"></span><span>${e(c)}</span><span class="cat-arrow">↗</span></button>`}).join('')}</div>${section('Shop by store','Different tastes. One great place to discover them.','All stores','sellers')}<div class="store-spotlight-grid">${storeHighlights()}</div><div class="collection-ribbon"><div><span class="eyebrow">CURATED FOR EVERYDAY LIFE</span><h2>Good finds, all in one place.</h2><p>Compare products, save your favorites, and shop across independent stores with one cart.</p><button class="btn primary" data-page="shop">Browse all products →</button></div><div class="collection-ribbon__images" aria-hidden="true"><img src="assets/products/p6.svg" alt="" width="180" height="180"><img src="assets/products/p10.svg" alt="" width="180" height="180"><img src="assets/products/p8.svg" alt="" width="180" height="180"></div></div>${section('Picked for you','Explore a little of everything from our original catalog.','See all','shop')}<div class="productgrid">${picks.map(card).join('')}</div><div class="between-head">${section('Fresh from the catalog','More pieces to discover, compare and save.','All products','shop')}</div><div class="productgrid">${visibleProducts().filter(p=>!picks.includes(p)).slice(0,8).map(card).join('')}</div><div class="homepage-close"><div><span class="eyebrow">MAKE IT YOURS</span><h2>Found something you love?</h2><p>Bring your saved finds together, compare up to four products, and make your choice with confidence.</p></div><button class="btn primary" data-page="compare">Compare your favorites ↗</button></div></div>`}
function filtered(){let a=visibleProducts().filter(p=>(ui.category==='All'||p.category===ui.category)&&(!ui.query||[p.name,p.category,p.seller,p.sku].join(' ').toLowerCase().includes(ui.query.toLowerCase()))&&(ui.seller==='All'||p.seller===ui.seller)&&(!ui.inStock||ownAvailable(p)>0)&&(!ui.maxPrice||p.price<=Number(ui.maxPrice)));switch(ui.sort){case'low':a.sort((x,y)=>x.price-y.price);break;case'high':a.sort((x,y)=>y.price-x.price);break;case'az':a.sort((x,y)=>x.name.localeCompare(y.name));break;case'new':a.sort((x,y)=>y.id.localeCompare(x.id));break;}return a}
function filterForm(){return `<div class="filters surface" id="filterPanel"><h3 style="margin-bottom:5px">Filter products</h3><div class="filtergroup"><b>Category</b>${['All',...CATS].map(c=>`<label><input type="radio" name="filterCat" value="${e(c)}" ${ui.category===c?'checked':''}> ${e(c)}</label>`).join('')}</div><div class="filtergroup"><b>Seller</b>${['All',...db.sellers.filter(s=>s.status==='approved').map(s=>s.name)].map(s=>`<label><input type="radio" name="filterSeller" value="${e(s)}" ${ui.seller===s?'checked':''}> ${e(s)}</label>`).join('')}</div><div class="filtergroup"><b>Maximum price (PHP)</b><input type="number" id="priceFilter" min="0" placeholder="No limit" value="${e(ui.maxPrice)}"><label><input type="checkbox" id="stockFilter" ${ui.inStock?'checked':''}> In stock only</label></div><button class="btn ghost full" data-clear-filters>Clear filters</button></div>`}
function shop(){let a=filtered();let storeFilter=ui.seller!=='All'?db.sellers.find(s=>s.name===ui.seller):null;let meta=storeFilter?storeMeta(storeFilter.name):null;return `<div class="wrap page"><div class="crumb"><button data-page="home">Home</button> / Catalog ${ui.category==='All'?'':' / '+e(ui.category)}</div><div class="section-head" style="margin-top:0"><div><h1>${ui.query?'Search results':ui.category==='All'?'All products':e(ui.category)}</h1><p>${a.length} products · Browse, compare, or save items</p></div></div>${storeFilter?`<div class="store-filter-banner"><img src="${e(meta.mark)}" width="46" height="46" alt=""><div><b>Shopping ${e(storeFilter.name)}</b><span>${e(storeFilter.tagline||meta.tagline)}</span></div><button data-store="${e(storeFilter.name)}">View store ↗</button><button data-shop-all>Clear store filter ×</button></div>`:``}<div class="toolbar"><button class="btn ghost mobilefilters" data-action="filters">☷ All filters</button><span class="small subtle">${e(ui.query?`Results for “${ui.query}”`:'Find the right product for you')}</span><label class="flex small">Sort by <select id="sortFilter" style="border:1px solid var(--line);border-radius:9px;padding:9px"><option value="featured" ${ui.sort==='featured'?'selected':''}>Featured</option><option value="low" ${ui.sort==='low'?'selected':''}>Price: low to high</option><option value="high" ${ui.sort==='high'?'selected':''}>Price: high to low</option><option value="az" ${ui.sort==='az'?'selected':''}>Name: A–Z</option><option value="new" ${ui.sort==='new'?'selected':''}>Newer products</option></select></label></div><div class="catalog-layout">${filterForm()}<div>${a.length?`<div class="productgrid">${a.map(card).join('')}</div>`:`<div class="surface empty"><h3>No matching products</h3>Try removing a filter or searching another category.<p><button class="btn primary" data-clear-filters>Clear filters</button></p></div>`}</div></div></div>`}
function sellers(){return `<div class="wrap page stores-directory"><div class="crumb"><button data-page="home">Home</button> / Our stores</div><span class="eyebrow">DISCOVER THE PEOPLE BEHIND THE PRODUCTS</span><div class="directory-heading"><div><h1>One destination, distinct stores.</h1><p>Explore each independent seller's own collection, aesthetic, and featured products.</p></div><button class="btn ghost" data-page="shop">Explore all products ↗</button></div><div class="store-directory-grid">${db.sellers.filter(s=>s.status==='approved').map(s=>{let b=storeMeta(s.name),items=db.products.filter(p=>p.seller===s.name&&p.published);return `<article class="directory-store directory-${e(b.slug)}"><div class="directory-cover"><div class="directory-intro">${storeBadge(s.name,'large')}<span>${e(b.eyebrow)}</span><h2>${e(s.headline||b.headline)}</h2><p>${e(s.tagline||b.tagline)}</p><button class="btn store-primary" data-store="${e(s.name)}">Step inside ↗</button></div><div class="directory-art">${items.slice(0,3).map(p=>`<img src="${e(p.photo||p.fallback)}" onerror="this.onerror=null;this.src='${e(p.fallback)}'" alt="" width="150" height="150">`).join('')}</div></div><div class="directory-info"><div><b>${e(s.name)}</b><p>${e(s.description||b.intro)}</p></div><span class="pill">${items.length} products</span></div></article>`}).join('')}</div><div class="directory-footer surface"><div><h3>More from SaleSync Online</h3><p>Browse by category or compare products across stores—your cart stays in one place.</p></div><button class="btn primary" data-page="shop">Shop all products</button></div></div>`}
function wishlist(){let a=db.wish.map(product).filter(Boolean);return `<div class="wrap page"><div class="crumb">Home / Wishlist</div><h1>Wishlist</h1><p class="subtle">Keep your favorites in one place.</p>${a.length?`<div class="productgrid" style="margin-top:22px">${a.map(card).join('')}</div>`:`<div class="surface empty"><h3>Nothing saved yet</h3><p>Tap the heart icon on a product.</p><button class="btn primary" data-page="shop">Browse products</button></div>`}</div>`}
function compare(){let a=db.compare.map(product).filter(Boolean);if(!a.length)return `<div class="wrap page"><h1>Compare products</h1><div class="surface empty"><h3>No comparison items</h3><p>Choose 2 to 4 items to view them side by side.</p><button class="btn primary" data-page="shop">Explore products</button></div></div>`;const common=[['Product',p=>e(p.name)],['Seller',p=>e(p.seller)],['Category',p=>e(p.category)],['SKU',p=>e(p.sku)],['Price',p=>fmt(p.price)],['Previous price',p=>p.was>p.price?fmt(p.was):'—'],['Stock',p=>stockText(p)],['Brand / Model',p=>e(p.spec?.Brand||'Not specified')+' / '+e(p.spec?.Model||'Not specified')],['Warranty',p=>e(p.spec?.Warranty||'Not specified')]];let extra=[...new Set(a.flatMap(p=>Object.keys(p.spec||{}).filter(k=>!['Brand','Model','Warranty'].includes(k))))].map(k=>[k,p=>e(p.spec?.[k]||'—')]);return `<div class="wrap page"><div class="crumb">Home / Compare</div><div class="toolbar"><div><h1>Product comparison</h1><p class="subtle">${a.length}/4 selected · Same-category comparisons are usually most useful.</p></div><button class="btn ghost" data-clear-compare>Clear comparison</button></div>${a.length<2?'<p class="notice warn">Select at least one more product to compare.</p>':''}<div class="table-wrap" style="margin-top:15px"><table class="comparetable"><thead><tr><th>Feature</th>${a.map(p=>`<th><div style="width:170px">${image(p)}<strong>${e(p.name)}</strong><p class="small">${fmt(p.price)}</p><button class="btn mini alt" data-detail="${p.id}">View</button> <button class="btn mini ghost" data-compare="${p.id}">Remove</button></div></th>`).join('')}</tr></thead><tbody>${[...common,...extra].map(([label,get])=>`<tr><th>${e(label)}</th>${a.map(p=>`<td>${get(p)}</td>`).join('')}</tr>`).join('')}<tr><th>Shop</th>${a.map(p=>`<td><button class="btn primary mini" data-add="${p.id}" ${ownAvailable(p)<1?'disabled':''}>Add to cart</button></td>`).join('')}</tr></tbody></table></div></div>`}
function cartItems(){return Object.entries(db.cart).map(([id,qty])=>({...product(id),qty})).filter(p=>p.id&&p.qty>0)}
function itemsSub(){return cartItems().reduce((s,l)=>s+l.price*l.qty,0)}
function getDiscount(c){let rows=cartItems(),sub=itemsSub(),code=(c||db.voucher||'').toUpperCase();let v=vouchers.find(x=>x.code===code);if(!v)return 0;let eligible=rows.filter(x=>(!v.category||x.category===v.category)&&(!v.seller||x.seller===v.seller)).reduce((s,x)=>s+x.price*x.qty,0);if(eligible<v.min||v.first&&db.orders.some(o=>o.status==='delivered'||o.status==='paid'||o.status==='shipped'))return 0;if(v.type==='ship')return 0;return Math.min(eligible,v.type==='percent'?Math.round(eligible*v.value/100):v.value,v.cap??Infinity)}
function shipping(){return new Set(cartItems().map(p=>p.seller)).size*Number(db.settings.shipping||69)}
function shipDisc(c){let code=(c||db.voucher||'').toUpperCase(),v=vouchers.find(x=>x.code===code);if(!v||v.type!=='ship'||itemsSub()<v.min)return 0;return Math.min(shipping(),v.value)}
function total(){return Math.max(0,itemsSub()+shipping()-getDiscount()-shipDisc())}
function cartLine(l){return `<div class="lineitem">${image(l)}<div style="flex:1;min-width:0"><strong>${e(l.name)}</strong><div class="small subtle">${e(l.seller)} · ${fmt(l.price)}</div><div class="flex wraptext" style="margin-top:8px"><div class="qty"><button data-qty="${l.id}|-1" aria-label="Decrease quantity">−</button><b>${l.qty}</b><button data-qty="${l.id}|1" aria-label="Increase quantity">+</button></div><button class="btn mini ghost" data-save-later="${l.id}">Save for later</button><button class="btn mini danger" data-remove-cart="${l.id}">Remove</button></div></div><b>${fmt(l.price*l.qty)}</b></div>`}
function cart(){let rows=cartItems();return `<div class="wrap page"><div class="crumb">Home / Shopping cart</div><h1>Your shopping cart</h1><p class="subtle">Adjust quantities and review totals before payment.</p>${rows.length?`<div class="checkoutgrid" style="margin-top:20px"><div class="surface section-box">${[...new Set(rows.map(x=>x.seller))].map(s=>`<h3>${e(s)}</h3>${rows.filter(x=>x.seller===s).map(cartLine).join('')}`).join('')}</div><div class="surface section-box" style="align-self:start"><h3>Order summary</h3><div class="stack small"><div class="flex between"><span>Subtotal</span><b>${fmt(itemsSub())}</b></div><div class="flex between"><span>Estimated shipping</span><b>${fmt(shipping())}</b></div><div class="flex between"><span>Discount</span><b>−${fmt(getDiscount()+shipDisc())}</b></div><div class="field"><label for="voucher">Voucher code</label><div class="flex"><input id="voucher" value="${e(db.voucher)}" placeholder="e.g. SHOP10" style="width:100%;min-width:0;padding:10px;border:1px solid var(--line);border-radius:9px"><button class="btn mini ghost" data-voucher>Apply</button></div></div><div class="flex between" style="font-size:21px;border-top:1px solid var(--line);padding-top:13px"><b>Total</b><b>${fmt(total())}</b></div><button class="btn primary full" data-page="checkout">Continue to checkout →</button><p class="tiny subtle">Payment is completed only through PayMongo Hosted Checkout in the live application.</p></div></div></div>`:`<div class="surface empty"><h3>Your cart is empty</h3><p>Add a product to begin shopping.</p><button class="btn primary" data-page="shop">Shop products</button></div>`}${savedSection()}</div>`}
function savedSection(){return `<div class="section-head"><h2>Saved for later</h2></div>${db.saved.length?`<div class="productgrid">${db.saved.map(product).filter(Boolean).map(card).join('')}</div>`:'<p class="subtle small">Items you save for later will appear here.</p>'}`}
function login(){return `<div class="wrap page" style="max-width:760px"><div class="surface block"><span class="pill">Prototype access</span><h1 style="margin-top:15px">Sign in to SaleSync Online</h1><p class="subtle">This is an interactive UI prototype. Select a role in the demo controls to try other workflows; no real account is authenticated.</p><form id="loginForm" class="stack" style="max-width:470px"><div class="field"><label>Email address</label><input required type="email" name="email" placeholder="name@example.com"></div><div class="field"><label>Password</label><input required type="password" name="password" placeholder="Password"></div><button class="btn primary">Continue (demo only)</button></form><div class="flex wraptext" style="margin-top:17px"><button class="btn ghost mini" data-page="register">Create account</button><button class="btn ghost mini" data-page="seller-apply">Apply to sell</button><button class="btn ghost mini" data-action="password-reset">Forgot password?</button></div></div></div>`}
function register(){return `<div class="wrap page" style="max-width:760px"><div class="surface block"><h1>Create an account</h1><p class="subtle">Demonstration registration with local browser-only data.</p><form id="registerForm" class="stack"><div class="grid2"><div class="field"><label>Full name</label><input name="name" required minlength="2"></div><div class="field"><label>Mobile number</label><input name="phone" required pattern="09[0-9]{9}" placeholder="09XXXXXXXXX"></div></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required minlength="8"><small>Demo only. This password is not stored or authenticated.</small></div><label><input type="checkbox" required> I understand this is a demonstration and does not create a real account.</label><button class="btn primary">Create demo customer</button></form></div></div>`}
function setPage(pg){if(pg==='checkout'&&!cartItems().length){notify('Add products before checkout');pg='shop'}if(pg==='account'&&!isCustomer()){pg='login'}if(pg==='orders'&&!isCustomer()){pg='login'}if(pg==='seller'&&!isSeller()){notify('Seller workspace is restricted in this demo');pg='home'}if(pg==='admin'&&!isAdmin()){notify('Management workspace is restricted');pg='home'}if(pg==='maintenance'&&!isMaint()){notify('Maintenance workspace is restricted');pg='home'}ui.page=pg;window.scrollTo({top:0,behavior:'instant'});render()}
function accountMenu(){return `<aside class="surface appnav"><div class="role-title">My account</div>${[['orders','Orders & tracking'],['profile','Profile & addresses'],['wish','Wishlist & saved'],['vouchers','Vouchers'],['notifications','Notifications'],['support','Help requests']].map(([id,name])=>`<button class="${ui.customerTab===id?'active':''}" data-customer-tab="${id}">${name}</button>`).join('')}</aside>`}
function account(){let tab=ui.customerTab;return `<div class="wrap page"><div class="crumb">Home / My account</div><div class="section-head" style="margin-top:0"><div><h1>My account</h1><p>Welcome, ${e(db.profile.name)}.</p></div><span class="pill">Customer demo</span></div><div class="side-layout">${accountMenu()}<div>${tab==='orders'?ordersPanel():tab==='profile'?profilePanel():tab==='wish'?`<div class="surface section-box"><h2>Saved products</h2>${wishlistInner()}${savedSection()}</div>`:tab==='vouchers'?voucherPanel():tab==='notifications'?notificationPanel():supportPanel()}</div></div></div>`}
function wishlistInner(){return db.wish.length?`<div class="productgrid">${db.wish.map(product).filter(Boolean).map(card).join('')}</div>`:'<p class="subtle">No wishlist items yet.</p>'}
function voucherPanel(){return `<div class="surface section-box"><h2>Vouchers</h2><p class="subtle">Sample marketing codes. Eligibility is calculated from items in your cart.</p><div class="grid2">${vouchers.map(v=>`<div class="surface block"><b>${e(v.code)}</b><p class="small subtle">${v.type==='percent'?v.value+'% discount':fmt(v.value)+' '+(v.type==='ship'?'shipping discount':'discount')} · Minimum ${fmt(v.min||0)}</p><button class="btn mini ghost" data-set-voucher="${v.code}">Apply to cart</button></div>`).join('')}</div></div>`}
function profilePanel(){let a=db.addresses;return `<div class="stack"><div class="surface section-box"><h2>Profile information</h2><form id="profileForm" class="stack"><div class="grid2"><div class="field"><label>Full name</label><input required name="name" value="${e(db.profile.name)}"></div><div class="field"><label>Mobile</label><input required name="phone" pattern="09[0-9]{9}" value="${e(db.profile.phone)}"></div></div><div class="field"><label>Email</label><input type="email" required name="email" value="${e(db.profile.email)}"></div><label><input type="checkbox" name="alerts" ${db.profile.alerts?'checked':''}> Receive order-status notifications (demo)</label><div><button class="btn primary">Save profile</button></div></form></div><div class="surface section-box"><div class="toolbar"><h2>Saved addresses</h2><button class="btn mini primary" data-action="new-address">+ Add address</button></div>${a.map(x=>`<div class="lineitem"><div style="flex:1"><b>${e(x.name)} ${x.default?'· Default':''}</b><div class="small subtle">${e(x.address)}, ${e(x.barangay)}, ${e(x.city)}, ${e(x.province)} ${e(x.postal)}<br>${e(x.phone)}</div></div><button class="btn mini ghost" data-edit-address="${e(x.id)}">Edit</button>${a.length>1?`<button class="btn mini danger" data-delete-address="${e(x.id)}">Remove</button>`:''}</div>`).join('')}</div></div>`}
function notificationPanel(){return `<div class="surface section-box"><div class="toolbar"><h2>Notifications</h2><button class="btn mini ghost" data-action="mark-read">Mark all read</button></div>${db.notifications.length?db.notifications.map(n=>`<div class="lineitem"><span class="pill ${n.read?'':'good'}">${n.read?'Read':'New'}</span><div><b>${e(n.msg)}</b><div class="small subtle">${when(n.at)}</div></div></div>`).join(''):'<p class="subtle">No notifications yet. Updates will appear after your demo actions.</p>'}</div>`}
function supportPanel(){return `<div class="surface section-box"><h2>Help and support</h2><p class="notice warn">Business support contact details and policies have not been approved for launch.</p><form id="supportForm" class="stack"><div class="field"><label>Topic</label><select required name="topic"><option>Order question</option><option>Product concern</option><option>Return request</option><option>Other</option></select></div><div class="field"><label>Message</label><textarea rows="4" required minlength="10" name="message"></textarea></div><button class="btn primary">Submit demo help request</button></form></div>`}
function orderStatus(o){return ({pending_payment:'Pending payment',payment_processing:'Verifying payment (demo)',payment_failed:'Payment failed (demo)',payment_expired:'Payment expired (demo)',cancelled:'Cancelled',paid:'Payment confirmed (demo)',processing:'Processing',packed:'Packed',shipped:'Shipped',out_for_delivery:'Out for delivery',delivered:'Delivered',refund_pending:'Refund pending',refunded:'Refunded',return_requested:'Return requested'})[o.status]||o.status}
function ordersPanel(){return `<div class="surface section-box"><div class="toolbar"><h2>My orders</h2><span class="pill">${db.orders.length} orders</span></div>${db.orders.length?db.orders.filter(o=>o.customerEmail===db.profile.email).map(o=>`<div class="surface block" style="margin-bottom:13px"><div class="toolbar"><div><b>${e(o.id)}</b><div class="small subtle">${when(o.createdAt)} · ${o.lines.length} line(s)</div></div><span class="pill ${['payment_failed','payment_expired','cancelled'].includes(o.status)?'bad':['paid','delivered'].includes(o.status)?'good':'warn'}">${orderStatus(o)}</span></div><div class="flex between wraptext"><b>${fmt(o.total)}</b><button class="btn mini primary" data-order-detail="${e(o.id)}">View order & tracking</button></div></div>`).join(''):'<div class="empty"><h3>No orders yet</h3><p>Purchases made through the demo checkout appear here.</p><button class="btn primary" data-page="shop">Browse products</button></div>'}</div>`}
function orderDetail(id){let o=db.orders.find(o=>o.id===id);if(!o){notify('Order not found');return}ui.activeId=id;openOverlay('Order details & tracking',`<div class="stack"><div class="notice">Demonstration record — no money collected, courier contacted, or provider payment verified.</div><div class="toolbar"><b>${e(o.id)}</b><span class="pill">${orderStatus(o)}</span></div><div class="statuspath">${['pending_payment','paid','processing','packed','shipped','out_for_delivery','delivered'].map(s=>`<span class="${o.history.some(h=>h.status===s)?'done':''}">${({pending_payment:'Pending',paid:'Demo paid',processing:'Processing',packed:'Packed',shipped:'Shipped',out_for_delivery:'Out for delivery',delivered:'Delivered'})[s]}</span>`).join('')}</div>${o.lines.map(l=>`<div class="lineitem">${image(product(l.id)||l)}<div style="flex:1"><b>${e(l.name)}</b><div class="small subtle">${e(l.seller)} · Qty ${l.qty}</div></div><b>${fmt(l.price*l.qty)}</b></div>`).join('')}<div class="flex between"><b>Total</b><b>${fmt(o.total)}</b></div><h3>Shipment tracking</h3>${o.shipments.map(s=>`<div class="surface block"><b>${e(s.seller)} — ${e(s.status)}</b><div class="small subtle">${s.courier?e(s.courier):'Courier not assigned'} ${s.tracking?' · Tracking: '+e(s.tracking):''}</div></div>`).join('')}<h3>Order history</h3>${o.history.map(h=>`<div class="flex between small" style="border-bottom:1px solid var(--line);padding:9px"><span>${e(h.note)}</span><span class="subtle">${when(h.at)}</span></div>`).join('')}${['paid','processing','packed'].includes(o.status)&&isCustomer()?`<button class="btn danger" data-cancel-order="${e(o.id)}">Request cancellation</button>`:''}${o.status==='delivered'&&isCustomer()?`<div class="flex wraptext"><button class="btn ghost" data-action="review|${e(o.id)}">Write eligible review</button><button class="btn danger" data-action="request-return|${e(o.id)}">Request return</button></div>`:''}<button class="btn ghost" data-receipt="${e(o.id)}">Download sample receipt (.txt)</button></div>`)}
function orders(){return `<div class="wrap page"><h1>Order history</h1><div class="notice">Sign in as the demo customer to review purchase and fulfillment events.</div>${ordersPanel()}</div>`}
function addressForm(a={}){return `<form id="addressForm" class="stack"><input type="hidden" name="id" value="${e(a.id||'')}"><div class="grid2"><div class="field"><label>Recipient name</label><input name="name" required value="${e(a.name||'')}"></div><div class="field"><label>Philippine mobile</label><input name="phone" required pattern="09[0-9]{9}" placeholder="09XXXXXXXXX" value="${e(a.phone||'')}"></div></div><div class="field"><label>Street, house, building</label><input name="address" required value="${e(a.address||'')}"></div><div class="grid2"><div class="field"><label>Barangay</label><input name="barangay" required value="${e(a.barangay||'')}"></div><div class="field"><label>City / Municipality</label><input name="city" required value="${e(a.city||'')}"></div><div class="field"><label>Province / Region</label><input name="province" required value="${e(a.province||'')}"></div><div class="field"><label>Postal code</label><input name="postal" required pattern="[0-9]{4}" value="${e(a.postal||'')}"></div></div><label><input type="checkbox" name="default" ${a.default?'checked':''}> Set as default</label><button class="btn primary full">Save address</button></form>`}
function checkout(){if(!isCustomer())return `<div class="wrap page" style="max-width:800px"><div class="surface section-box"><h1>Continue securely</h1><p>Sign in or create an account before using the prototype checkout. Guest browsing and cart are supported.</p><button class="btn primary" data-page="login">Sign in (demo)</button> <button class="btn ghost" data-page="register">Register</button><button class="btn ghost" data-page="cart">Back to cart</button></div></div>`;let a=db.addresses.find(x=>x.default)||db.addresses[0];return `<div class="wrap page"><div class="crumb">Cart / Checkout</div><h1>Secure checkout</h1><p class="notice warn">UI demo only. The PayMongo step simulates provider outcomes and does not charge or verify real payments.</p><div class="steps">${['Delivery','Review','PayMongo','Confirmation'].map((x,i)=>`<div class="${ui.checkoutStep===i+1?'active':''}"><b>${i+1}</b>${x}</div>`).join('')}</div><div class="checkoutgrid"><section class="surface section-box">${ui.checkoutStep===1?`<h2>Delivery details</h2><p class="subtle small">Your shipping address must be in the Philippines.</p><form id="deliveryForm" class="stack"><div class="grid2"><div class="field"><label>Recipient's full name</label><input required name="name" value="${e(ui.shipping.name||a?.name||'')}"></div><div class="field"><label>Mobile number</label><input required name="phone" pattern="09[0-9]{9}" title="Enter 11-digit mobile number beginning 09" value="${e(ui.shipping.phone||a?.phone||'')}"></div></div><div class="field"><label>Email</label><input name="email" type="email" required value="${e(db.profile.email)}"></div><div class="field"><label>House/Street/Building</label><input required name="address" value="${e(ui.shipping.address||a?.address||'')}"></div><div class="grid2"><div class="field"><label>Barangay</label><input name="barangay" required value="${e(ui.shipping.barangay||a?.barangay||'')}"></div><div class="field"><label>City/Municipality</label><input name="city" required value="${e(ui.shipping.city||a?.city||'')}"></div><div class="field"><label>Province</label><input name="province" required value="${e(ui.shipping.province||a?.province||'')}"></div><div class="field"><label>ZIP/Postal code</label><input name="postal" pattern="[0-9]{4}" required value="${e(ui.shipping.postal||a?.postal||'')}"></div></div><div class="field"><label>Delivery notes (optional)</label><textarea name="notes" rows="2">${e(ui.shipping.notes||'')}</textarea></div><button class="btn primary" type="submit">Continue to order review →</button></form>`:ui.checkoutStep===2?`<h2>Review your order</h2><p class="subtle">Confirm products and delivery information before moving to PayMongo.</p>${cartItems().map(l=>`<div class="lineitem">${image(l)}<div style="flex:1"><b>${e(l.name)}</b><p class="small subtle">${e(l.seller)} · ${l.qty} × ${fmt(l.price)}</p></div><b>${fmt(l.price*l.qty)}</b></div>`).join('')}<div class="notice">${e(ui.shipping.name)} · ${e(ui.shipping.phone)}<br>${e(ui.shipping.address)}, ${e(ui.shipping.barangay)}, ${e(ui.shipping.city)}, ${e(ui.shipping.province)} ${e(ui.shipping.postal)}</div><label class="small"><input type="checkbox" id="termsConsent"> I understand this is a payment simulation and the site's legal policies require business approval.</label><div class="flex wraptext" style="margin-top:15px"><button class="btn ghost" data-checkout-back>← Edit delivery</button><button class="btn primary" data-checkout-start>Proceed to PayMongo (demo) →</button></div>`:ui.checkoutStep===3?paymentStage():`<div class="notice">Open My Orders to view your demo transaction.</div><button class="btn primary" data-page="account">My orders</button>`}</section><aside class="surface section-box" style="align-self:start"><h3>Order total</h3><div class="stack small"><div class="flex between"><span>Items</span><b>${fmt(itemsSub())}</b></div><div class="flex between"><span>Shipping (${new Set(cartItems().map(l=>l.seller)).size} seller groups)</span><b>${fmt(shipping())}</b></div><div class="flex between"><span>Voucher</span><b>−${fmt(getDiscount()+shipDisc())}</b></div><div class="flex between" style="font-size:21px;border-top:1px solid var(--line);padding-top:14px"><b>Total</b><b>${fmt(total())}</b></div><p class="tiny subtle">Only PayMongo Hosted Checkout is available. Shipping fee is a configurable illustrative rate per seller.</p></div></aside></div></div>`}
function paymentStage(){let o=db.orders.find(x=>x.id===ui.orderId);if(!o)return `<h2>No pending checkout</h2><button class="btn" data-page="cart">Back to cart</button>`;return `<div class="stack"><span class="pill warn">Demo PayMongo hosted step</span><h2>Awaiting payment</h2><p>This is a controlled payment test for <b>${e(o.id)}</b>. No live PayMongo API is used. Select an outcome to simulate a verified server event.</p><div class="notice warn">Production rule: the return URL or browser click must never mark an order paid. A backend must verify PayMongo webhooks and amounts.</div><b>${fmt(o.total)}</b><button class="btn primary full" data-payment-outcome="paid">Simulate verified success</button><button class="btn ghost full" data-payment-outcome="payment_failed">Simulate payment failure</button><button class="btn ghost full" data-payment-outcome="payment_expired">Simulate checkout expiration</button><button class="btn danger full" data-payment-outcome="cancelled">Cancel payment</button></div>`}
function startCheckout(){if(!isCustomer()||!cartItems().length){notify('Customer account and cart required');return}let failed=cartItems().find(l=>!product(l.id)?.published||ownAvailable(product(l.id))<l.qty);if(failed){notify('Not enough primary stock for '+failed.name+'. Backup reference cannot auto-fulfill orders.');setPage('cart');return}const now=new Date().toISOString();let id='EC-'+new Date().getFullYear()+'-'+String(db.counter++).padStart(6,'0');let lines=cartItems().map(l=>({id:l.id,name:l.name,seller:l.seller,sku:l.sku,qty:l.qty,price:l.price,committed:false}));let order={id,lines,total:total(),shipping:shipping(),discount:getDiscount()+shipDisc(),voucher:db.voucher,customerEmail:db.profile.email,delivery:structuredClone(ui.shipping),status:'pending_payment',createdAt:now,shipments:[...new Set(lines.map(l=>l.seller))].map(s=>({seller:s,status:'awaiting_payment',courier:'',tracking:''})),history:[{status:'pending_payment',note:'Checkout initiated (simulation)',at:now}]};db.orders.unshift(order);ui.orderId=id;ui.checkoutStep=3;log('Customer demo','CREATE_ORDER',id+' awaiting mock payment');save('Awaiting PayMongo demo outcome')}
function paymentOutcome(status){let o=db.orders.find(o=>o.id===ui.orderId);if(!o||o.status!=='pending_payment')return notify('This checkout is no longer awaiting payment');o.status=status;let now=new Date().toISOString();if(status==='paid'){o.shipments.forEach(s=>s.status='processing');o.history.push({status:'paid',note:'Mock provider verification accepted — NO REAL PAYMENT',at:now});db.cart={};db.voucher='';message('Demo payment confirmed for '+o.id+'. Sellers can now prepare the order.');log('Payment simulator','SIMULATED_PAID',o.id)}else{o.history.push({status,note:'Mock payment ended: '+status,at:now});message('Your sample checkout '+o.id+' is '+orderStatus(o));log('Payment simulator','SIMULATED_'+status.toUpperCase(),o.id)}ui.checkoutStep=4;save('Mock payment outcome: '+orderStatus(o));orderDetail(o.id)}
function cancelOrder(id){let o=db.orders.find(o=>o.id===id);if(!o||!['paid','processing','packed'].includes(o.status))return notify('Order cannot be cancelled at this stage');if(!isCustomer()&&!isAdmin())return notify('Not authorized');o.status='refund_pending';o.history.push({status:'refund_pending',at:new Date().toISOString(),note:'Cancellation requested; refund review required (demo)'});o.shipments.forEach(s=>s.status='cancel_requested');log(ui.role,'CANCELLATION_REQUEST',id);message('Cancellation requested for '+id);closeOverlay();save('Refund review requested — no real refund issued')}
function sellerApply(){const app=db.applications.find(a=>a.email==='applicant@example.test');return `<div class="wrap page" style="max-width:850px"><div class="crumb">Home / Become a seller</div><div class="surface section-box"><span class="pill">Sell on SaleSync Online</span><h1 style="margin-top:15px">Apply to become a seller</h1><p class="subtle">Seller applications are reviewed by Management Admin. Pending sellers cannot publish products.</p>${app&&ui.role==='pending'?`<div class="notice warn"><b>Pending approval</b><p>Your sample store ${e(app.store)} is awaiting management review.</p></div>`:`<form id="sellerApplicationForm" class="stack"><div class="grid2"><div class="field"><label>Store name</label><input required name="store" minlength="3"></div><div class="field"><label>Owner name</label><input required name="owner"></div><div class="field"><label>Business email</label><input required type="email" name="email"></div><div class="field"><label>Contact number</label><input required pattern="09[0-9]{9}" name="phone"></div></div><div class="field"><label>Store description</label><textarea required minlength="15" rows="3" name="description"></textarea></div><p class="small subtle">Required identification and business verification documents must be defined and handled securely by the production service. Do not enter real IDs into this browser demo.</p><button class="btn primary">Submit seller application</button></form>`}</div></div>`}
function sellerNav(){let opts=[['dashboard','Overview'],['products','My products'],['orders','Fulfillment'],['feedback','Reviews'],['reports','Sales reports'],['store','Store profile']];return `<aside class="surface appnav"><div class="role-title">Seller workspace</div>${opts.map(([id,name])=>`<button class="${ui.sellerTab===id?'active':''}" data-seller-tab="${id}">${name}</button>`).join('')}</aside>`}
function selProducts(){return db.products.filter(p=>p.seller===activeSellerName())}
function seller(){let arr=selProducts(),shipments=db.orders.filter(o=>!['pending_payment','payment_failed','payment_expired','cancelled'].includes(o.status)&&o.lines.some(l=>l.seller===activeSellerName()));return `<div class="wrap page"><div class="crumb">Workspace / Seller</div><div class="toolbar"><div class="seller-page-ident">${storeBadge(activeSellerName(),'large')}<div><h1>${e(activeSellerName())}</h1><p class="subtle">${e(db.sellers.find(s=>s.name===activeSellerName())?.tagline||storeMeta(activeSellerName()).tagline)} · Store management preview</p></div></div><span class="pill good">Approved seller</span></div><div class="side-layout">${sellerNav()}<main>${ui.sellerTab==='dashboard'?`<div class="kpis"><div class="surface kpi"><span>Products</span><strong>${arr.filter(p=>p.published).length}</strong></div><div class="surface kpi"><span>Fulfillable orders</span><strong>${shipments.length}</strong></div><div class="surface kpi"><span>Low primary stock</span><strong>${arr.filter(p=>ownAvailable(p)<=p.lowThreshold).length}</strong></div><div class="surface kpi"><span>Paid-demo gross</span><strong>${fmt(shipments.reduce((sum,o)=>sum+o.lines.filter(l=>l.seller===activeSellerName()).reduce((x,l)=>x+l.qty*l.price,0),0))}</strong></div></div><div class="surface section-box" style="margin-top:17px"><h2>Next actions</h2><p>Review your e-commerce stock, prepare confirmed demo orders, and update product details.</p><button class="btn primary" data-seller-tab="orders">Open fulfillment</button> <button class="btn ghost" data-seller-tab="products">Manage products</button></div>`:ui.sellerTab==='products'?sellerProductPanel(arr):ui.sellerTab==='orders'?sellerOrdersPanel(shipments):ui.sellerTab==='feedback'?sellerFeedback():ui.sellerTab==='reports'?sellerReports(shipments):sellerStore()}</main></div></div>`}
function sellerProductPanel(arr){return `<div class="surface section-box"><div class="toolbar"><div><h2>My products</h2><p class="subtle small">These edit the authoritative e-commerce demo catalog only.</p></div><button class="btn primary mini" data-action="new-product">+ Add product</button></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Price</th><th>Primary stock</th><th>Listing</th><th>Actions</th></tr></thead><tbody>${arr.map(p=>`<tr><td><div class="avatarline">${image(p)}<div><b>${e(p.name)}</b><div class="tiny subtle">${e(p.sku)}</div></div></div></td><td>${fmt(p.price)}</td><td>${ownAvailable(p)} ${ownAvailable(p)<=p.lowThreshold?'<span class="pill warn">Low</span>':''}</td><td><span class="pill ${p.published?'good':'warn'}">${p.published?'Published':'Archived'}</span></td><td><button class="btn mini ghost" data-product-edit="${e(p.id)}">Edit</button> <button class="btn mini ghost" data-adjust="${e(p.id)}">Adjust stock</button> <button class="btn mini ${p.published?'danger':'alt'}" data-archive="${e(p.id)}">${p.published?'Archive':'Restore'}</button></td></tr>`).join('')}</tbody></table></div></div>`}
function sellerOrdersPanel(orders){return `<div class="surface section-box"><h2>Order fulfillment</h2><p class="subtle small">Only orders with simulated verified payment are seller-ready.</p>${orders.length?`<div class="table-wrap"><table><thead><tr><th>Order</th><th>Status</th><th>Seller items</th><th>Action</th></tr></thead><tbody>${orders.map(o=>{let s=o.shipments.find(x=>x.seller===activeSellerName());return `<tr><td>${e(o.id)}</td><td><span class="pill">${e(s?.status||'Unknown')}</span></td><td>${o.lines.filter(l=>l.seller===activeSellerName()).map(l=>e(l.name)+' ×'+l.qty).join(', ')}</td><td><button class="btn mini primary" data-fulfill="${e(o.id)}">Open</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty"><h3>No orders to prepare</h3><p>Complete the customer checkout demo first, then return here.</p></div>'}</div>`}
function sellerFeedback(){let reviews=db.reviews.filter(r=>product(r.productId)?.seller===activeSellerName());return `<div class="surface section-box"><h2>Customer reviews</h2>${reviews.length?reviews.map(r=>`<div class="surface block" style="margin-bottom:12px"><b>${e(product(r.productId)?.name)}</b><p>${'★'.repeat(r.stars)} · ${e(r.text)}</p>${r.reply?`<p class="notice">Seller response: ${e(r.reply)}</p>`:`<button class="btn mini" data-action="reply|${e(r.id)}">Respond</button>`}</div>`).join(''):'<p class="subtle">Reviews appear when delivered orders are eligible and the customer submits feedback.</p>'}</div>`}
function sellerReports(orders){let paid=orders.filter(o=>['paid','processing','packed','shipped','out_for_delivery','delivered'].includes(o.status));return `<div class="surface section-box"><div class="toolbar"><h2>Sales report (demo)</h2><button class="btn mini ghost" data-export="seller">Export CSV</button></div><div class="kpis"><div class="surface kpi"><span>Orders</span><strong>${paid.length}</strong></div><div class="surface kpi"><span>Units</span><strong>${paid.reduce((s,o)=>s+o.lines.filter(l=>l.seller===activeSellerName()).reduce((x,l)=>x+l.qty,0),0)}</strong></div></div><p class="small subtle" style="margin-top:16px">Revenue amounts represent simulated activity, not payment processor settlements or seller payouts.</p></div>`}
function sellerStore(){let s=db.sellers.find(x=>x.name===activeSellerName()),b=storeMeta(s?.name||'');return `<div class="surface section-box"><div class="seller-profile-heading">${storeBadge(s.name,'large')}<div><span class="eyebrow">STORE IDENTITY</span><h2 style="margin:3px 0 5px">Your storefront identity</h2><p class="subtle">This profile is shared with the customer-facing store page.</p></div></div><div class="store-profile-preview store-cover--${e(b.slug)}"><span>${e(s.name)}</span><h3>${e(s.headline||b.headline)}</h3><p>${e(s.tagline||b.tagline)}</p></div><form id="storeForm" class="stack" style="margin-top:22px"><div class="field"><label>Store name</label><input disabled value="${e(s?.name)}"><small>Store names are managed by the platform in this demo.</small></div><div class="field"><label>Store headline</label><input name="headline" minlength="10" maxlength="72" required value="${e(s?.headline||b.headline)}"><small>Short headline displayed in your storefront hero.</small></div><div class="field"><label>Store tagline</label><input name="tagline" minlength="5" maxlength="55" required value="${e(s?.tagline||b.tagline)}"></div><div class="field"><label>About your store</label><textarea name="description" rows="4" minlength="20" maxlength="320" required>${e(s?.description||'')}</textarea></div><div class="notice">Store logo and accent colors are demonstration identity assets. Production uploads and approval require server-side storage and moderation.</div><button class="btn primary">Update storefront identity</button></form></div>`}

function overlayHtml(){return `<div class="scrim" id="scrim" data-close-overlay></div><div id="modal" class="overlay modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"><div class="overlay-top"><h2 id="modalTitle"></h2><button class="iconbutton" aria-label="Close dialog" data-close-overlay>×</button></div><div class="overlay-body" id="modalBody"></div></div>`}
function openOverlay(title,content,narrow=false){ui.previousFocus=document.activeElement;const m=$('#modal');$('#modalTitle').textContent=title;$('#modalBody').innerHTML=content;m.classList.add('show');m.classList.toggle('narrow',narrow);$('#scrim').classList.add('show');document.body.style.overflow='hidden';m.focus();ui.overlay=title}
function closeOverlay(){if(!ui.overlay)return;$('#modal')?.classList.remove('show');$('#scrim')?.classList.remove('show');document.body.style.overflow='';ui.overlay='';ui.previousFocus?.focus?.()}
function render(){let html=isSeller()?seller():isAdmin()?admin():isMaint()?maintenance():ui.role==='pending'?`<div class="wrap page"><div class="surface section-box"><h1>Seller application pending</h1><p>Your application is under review. You cannot manage seller listings until approval.</p><button class="btn ghost" data-page="seller-apply">View application</button></div></div>`:ui.role==='applicant'?sellerApply():({home,shop,cart,wishlist,compare,sellers,store:storeFront,login,register,account,orders,checkout,'seller-apply':sellerApply,policies,help})[ui.page]?.()||home();$('#app').innerHTML=header()+html+footer()+mobileNav();const tray=$('#comparetray');if(db.compare.length){tray.innerHTML=`<div class="flex between wraptext"><b>Compare ${db.compare.length}/4 products</b><div class="flex wraptext">${db.compare.map(id=>{let p=product(id);return p?`<span class="compitem">${image(p)}<span>${e(p.name).slice(0,17)}</span><button class="btn mini ghost" data-compare="${p.id}" aria-label="Remove ${e(p.name)}">×</button></span>`:''}).join('')}</div><div class="flex"><button class="btn mini ghost" data-clear-compare>Clear</button><button class="btn mini primary" data-page="compare" ${db.compare.length<2?'disabled':''}>Compare now</button></div></div>`;tray.classList.remove('hidden')}else tray.classList.add('hidden');$('#demorole').value=ui.role;$('#demoSeller').innerHTML=db.sellers.filter(x=>x.status==='approved').map(x=>`<option value="${e(x.id)}">${e(x.name)}</option>`).join('');if(!db.sellers.some(x=>x.id===ui.sellerId&&x.status==='approved'))ui.sellerId='tech';$('#demoSeller').value=ui.sellerId;$('#demoSeller').parentElement.classList.toggle('hidden',!isSeller());$('#devmode').textContent=ui.role==='guest'?'Guest browser':ui.role==='customer'?'Customer demo':ui.role==='seller'?'TechHub PH seller':ui.role==='admin'?'Management admin':ui.role==='maintenance'?'Maintenance admin':ui.role==='pending'?'Pending seller':'Seller applicant'}
function setRole(role){if(!['guest','customer','seller','admin','maintenance','applicant','pending'].includes(role))return;closeOverlay();ui.role=role;ui.page=role==='seller'?'seller':role==='admin'?'admin':role==='maintenance'?'maintenance':role==='pending'?'seller-apply':role==='applicant'?'seller-apply':'home';render();notify('Switched to '+role+' (UI simulation only; not secure authentication)')}
function getFormData(form){return Object.fromEntries(new FormData(form).entries())}
function detail(id){let p=product(id);if(!p)return;openOverlay('Product details',`<div class="details"><div class="detail-photo">${image(p)}</div><div class="stack"><span class="pill">${e(p.category)}</span><button class="detail-store-link" data-store="${e(p.seller)}">${storeBadge(p.seller)} <span>Visit store ↗</span></button><h2>${e(p.name)}</h2><div class="price">${fmt(p.price)} ${p.was>p.price?`<span class="was">${fmt(p.was)}</span>`:''}</div>${stockPill(p)}<div class="small subtle">SKU: ${e(p.sku)}</div><p>${e(p.description)}</p><div class="flex wraptext"><button class="btn primary" data-add="${p.id}" ${ownAvailable(p)<1?'disabled':''}>Add to cart</button><button class="btn ghost" data-wish="${p.id}">${db.wish.includes(p.id)?'♥ Saved':'♡ Save'}</button><button class="btn ghost" data-compare="${p.id}">${db.compare.includes(p.id)?'Remove comparison':'⊞ Compare'}</button></div><div class="notice">Product specifications, variations, actual delivery estimates and warranty terms must be confirmed by each seller.</div></div></div><h3 style="margin-top:25px">Specifications</h3><div class="specs">${Object.entries(p.spec||{}).map(([k,v])=>`<b>${e(k)}</b><span>${e(v||'Not specified')}</span>`).join('')}</div><h3 style="margin-top:22px">Customer reviews</h3>${db.reviews.filter(r=>r.productId===p.id).map(r=>`<div class="lineitem"><div><b>${'★'.repeat(r.stars)}</b><p>${e(r.text)}</p>${r.reply?`<p class="small subtle">Seller: ${e(r.reply)}</p>`:''}</div></div>`).join('')||'<p class="subtle">No eligible purchase reviews yet.</p>'}`)}
function fulfill(id){let o=db.orders.find(o=>o.id===id);if(!o||!isSeller())return notify('Seller access required');let ship=o.shipments.find(s=>s.seller===activeSellerName());if(!ship)return notify('This order is not for your store');let steps=['processing','packed','shipped','out_for_delivery','delivered'],i=steps.indexOf(ship.status),next=steps[i+1];openOverlay('Seller fulfillment · '+o.id,`<div class="stack"><div class="notice">Updates here affect the shared customer timeline and admin overview. No courier API is contacted.</div><b>Shipment status: ${e(ship.status)}</b>${o.lines.filter(l=>l.seller===activeSellerName()).map(l=>`<div class="lineitem">${image(product(l.id)||l)}<div>${e(l.name)} · Qty ${l.qty}</div></div>`).join('')}<div class="grid2"><div class="field"><label>Courier name (optional until shipped)</label><input id="courierField" value="${e(ship.courier||'')}"></div><div class="field"><label>Tracking reference</label><input id="trackingField" value="${e(ship.tracking||'')}"></div></div>${next?`<button class="btn primary" data-fulfill-next="${e(o.id)}|${next}">Mark as ${e(next.replaceAll('_',' '))}</button>`:'<span class="pill good">Shipment delivered</span>'}</div>`)}
function sellerFulfillNext(id,next){if(!isSeller())return notify('Seller role required');let o=db.orders.find(o=>o.id===id);let s=o?.shipments.find(x=>x.seller===activeSellerName());if(!o||!s||!['paid','processing','packed','shipped','out_for_delivery','delivered'].includes(o.status))return notify('Order is not ready');let steps=['processing','packed','shipped','out_for_delivery','delivered'],old=steps.indexOf(s.status),expected=steps[old+1];if(next!==expected)return notify('Invalid shipment transition');let courier=$('#courierField')?.value.trim(),tracking=$('#trackingField')?.value.trim();if(next==='shipped'&&(!courier||!tracking))return notify('Enter a courier and tracking reference before dispatch');s.status=next;s.courier=courier||s.courier;s.tracking=tracking||s.tracking;if(next==='shipped'){for(let l of o.lines.filter(l=>l.seller===activeSellerName()&&!l.committed)){let p=product(l.id);if(p){p.primary=Math.max(0,p.primary-l.qty);l.committed=true}}}let all=o.shipments.map(s=>s.status);o.status=all.every(x=>x==='delivered')?'delivered':all.every(x=>['shipped','out_for_delivery','delivered'].includes(x))?'shipped':all.every(x=>x==='packed')?'packed':'processing';o.history.push({status:o.status,note:`${s.seller} marked ${next.replaceAll('_',' ')}`,at:new Date().toISOString()});message(`Shipment for ${id}: ${next.replaceAll('_',' ')}`);log(activeSellerName(),'FULFILL_'+next.toUpperCase(),id);closeOverlay();save('Shipment status updated');fulfill(id)}
function makeReceipt(id){let o=db.orders.find(x=>x.id===id);if(!o)return;let content=['SaleSync Online — SAMPLE RECEIPT / NOT PROOF OF PAYMENT',o.id,'Status: '+orderStatus(o),'Date: '+when(o.createdAt),'Recipient: '+(o.delivery?.name||db.profile.name),'---',...o.lines.map(l=>l.name+' × '+l.qty+' — '+fmt(l.price*l.qty)),'---','Shipping: '+fmt(o.shipping),'Discount: '+fmt(o.discount),'Total: '+fmt(o.total),'','This record is simulated and no PayMongo payment was processed.'].join('\n');let b=new Blob([content],{type:'text/plain'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=o.id+'-SAMPLE-RECEIPT.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function csvExport(type){let isS=type==='seller',rows=db.orders.filter(o=>!isS||o.lines.some(l=>l.seller===activeSellerName())),content=[['Order','Status','Date','Line Items','Total PHP'],...rows.map(o=>[o.id,o.status,o.createdAt,o.lines.filter(l=>!isS||l.seller===activeSellerName()).map(l=>l.name+' x'+l.qty).join(' / '),isS?o.lines.filter(l=>l.seller===activeSellerName()).reduce((s,l)=>s+l.qty*l.price,0):o.total])].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let b=new Blob([content],{type:'text/csv'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=`SaleSync-${type}-sample-report.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
