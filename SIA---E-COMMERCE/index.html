<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ShopHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: { extend: { colors: { primary: "#2563eb" } } },
      };
    </script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header
      class="bg-white border-b sticky top-0 z-20 px-4 h-14 flex items-center justify-between"
    >
      <h1
        id="brand"
        class="text-xl font-bold text-primary cursor-pointer"
        onclick="app.navigate('home')"
      >
        <i class="fa-solid fa-store"></i> ShopHub
      </h1>
      <div class="flex items-center gap-4">
        <div id="acts" class="flex gap-4"></div>
        <div id="who" class="flex items-center gap-2"></div>
      </div>
    </header>
    <nav
      id="nav"
      class="bg-white border-b px-4 flex gap-5 overflow-x-auto text-sm py-2"
    ></nav>
    <div class="max-w-7xl mx-auto p-4 md:flex gap-6">
      <aside id="side" class="hidden"></aside>
      <main id="main" class="flex-1 min-w-0"></main>
    </div>
    <div
      id="modal"
      class="fixed inset-0 bg-black/50 hidden z-50 items-center justify-center p-4"
      role="dialog"
      aria-modal="true"
    >
      <div class="c p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
        <h3 id="mt" class="text-xl font-bold mb-2"></h3>
        <div id="mb" class="text-gray-600 mb-4 space-y-2 text-sm"></div>
        <div class="flex justify-end gap-2">
          <button id="mx" class="g" onclick="app.closeModal()">Cancel</button
          ><button id="mo" class="b">OK</button>
        </div>
      </div>
    </div>
    <div
      id="toast"
      aria-live="polite"
      class="fixed bottom-5 right-5 bg-gray-900 text-white px-4 py-3 rounded-lg shadow-xl text-sm opacity-0 translate-y-5 transition-all z-50"
    ></div>
    <script src="js/data.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/app.js"></script>
    <script src="js/views.js"></script>
  </body>
</html>
